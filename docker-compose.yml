services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: suropark
      POSTGRES_DB: suropark_db
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suropark -d suropark_db"]
      interval: 5s
      timeout: 5s
      retries: 5

secrets:
  pg_password:
    file: ./secrets/pg_password

volumes:
  pgdata:
